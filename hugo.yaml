baseURL: "https://Jayjo86.github.io/"   # swap for your custom domain later
languageCode: "en-us"
title: "Juergen Neulinger"
theme: "PaperMod"

enableRobotsTXT: true
pygmentsUseClasses: true

markup:
  goldmark:
    renderer:
      unsafe: true        # lets the Mermaid HTML through

params:
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: true
  ShowCodeCopyButtons: true
  ShowToc: true
  socialIcons:
    - name: linkedin
      url: "https://linkedin.com/in/juergen-neulinger"
    - name: github
      url: "https://github.com/Jayjo86"

menu:
  main:
    - name: Posts
      url: /posts/
      weight: 1
    - name: About
      url: /about/
      weight: 2