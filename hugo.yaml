baseURL: "https://juergen-neulinger.dev/"  
languageCode: "en-us"
title: "Juergen Neulinger"
theme: "PaperMod"

enableRobotsTXT: true
pygmentsUseClasses: true

taxonomies:
  tag: tags
  category: categories
  series: series

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: true
  ShowCodeCopyButtons: true
  ShowToc: true
  description: "Engineering notes by Juergen Neulinger — LLMs, architecture, and the software in between."
  images:
    - "images/og-give-up.png"
  socialIcons:
    - name: linkedin
      url: "https://linkedin.com/in/juergen-neulinger"
    - name: github
      url: "https://github.com/Jayjo86"

menu:
  main:
    - name: Posts
      url: /posts/
      weight: 1
    - name: About
      url: /about/
      weight: 2